name: Daily check-in

on:
  schedule:
    # Her gün 09:00 Europe/Istanbul ≈ 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-in:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.STREAK_PAT }}

      - name: Append today's entry
        env:
          TZ: Europe/Istanbul
        run: |
          set -euo pipefail
          TODAY="$(date +%Y-%m-%d)"
          FILE="ACTIVITY.md"

          if grep -q "| ${TODAY} |" "$FILE"; then
            echo "Already checked in for ${TODAY}"
            exit 0
          fi

          NOTES=(
            "daily check-in"
            "job search continuity"
            "kept the streak"
            "small progress day"
            "routine maintained"
          )
          NOTE="${NOTES[$((RANDOM % ${#NOTES[@]}))]}"

          printf "| %s | %s |\n" "$TODAY" "$NOTE" >> "$FILE"

          git config user.name "epiglotis"
          git config user.email "83986620+epiglotis@users.noreply.github.com"

          git add "$FILE"
          git commit -m "chore: daily check-in ${TODAY}"
          git push
